name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem would this feature solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the proposed implementation or behavior.
    validations:
      required: true

  - type: textarea
    id: hardware
    attributes:
      label: Hardware information
      description: If applicable, describe the hardware involved.

  - type: textarea
    id: additional
    attributes:
      label: Additional information
