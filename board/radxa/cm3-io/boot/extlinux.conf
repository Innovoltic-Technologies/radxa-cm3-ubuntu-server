	append root=UUID=320efabb-8ea9-45ee-819c-324fee604ad8 console=ttyS2,1500000n8 splash loglevel=4 rw earlycon=uart8250,mmio32,0xfe660000 consoleblank=0 console=tty1 coherent_pool=2M irqchip.gicv3_pseudo_nmi=0 cgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory swapaccount=1 kasan=off single
